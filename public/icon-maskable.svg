<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1115" />
      <stop offset="100%" stop-color="#090A0D" />
    </linearGradient>
    <linearGradient id="primaryGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full bleed background without corner radius for maskable android safe zone -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Safe zone contained elements (within 10-15% margin) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.2" />

  <!-- Candlesticks / Institutional bars inside safe zone -->
  <!-- Bar 1 (Left) -->
  <line x1="175" y1="195" x2="175" y2="325" stroke="#10B981" stroke-width="5" stroke-linecap="round" opacity="0.5" />
  <rect x="162" y="230" width="26" height="60" rx="6" fill="#10B981" opacity="0.7" />

  <!-- Bar 2 (Center - High) -->
  <line x1="256" y1="145" x2="256" y2="365" stroke="#10B981" stroke-width="7" stroke-linecap="round" filter="url(#glowMask)" />
  <rect x="238" y="190" width="36" height="120" rx="8" fill="url(#primaryGradMask)" filter="url(#glowMask)" />

  <!-- Bar 3 (Right) -->
  <line x1="337" y1="180" x2="337" y2="310" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" opacity="0.5" />
  <rect x="324" y="210" width="26" height="70" rx="6" fill="url(#accentGradMask)" opacity="0.8" />

  <!-- Upward Trend vector curve inside safe zone -->
  <path d="M 145 325 Q 225 300 256 230 T 365 165" fill="none" stroke="#34D399" stroke-width="8" stroke-linecap="round" filter="url(#glowMask)" />
  <polygon points="365,165 345,170 360,185" fill="#34D399" filter="url(#glowMask)" />
  <circle cx="365" cy="165" r="6" fill="#F0FDF4" />
</svg>
