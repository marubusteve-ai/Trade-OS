<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1115" />
      <stop offset="100%" stop-color="#090A0D" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect with safe margin -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1F242C" stroke-width="6" opacity="0.6" />

  <!-- Outer subtle grid rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.15" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.1" />

  <!-- Candlesticks / Institutional bars -->
  <!-- Bar 1 (Left) -->
  <line x1="160" y1="180" x2="160" y2="340" stroke="#10B981" stroke-width="6" stroke-linecap="round" opacity="0.4" />
  <rect x="144" y="220" width="32" height="70" rx="8" fill="#10B981" opacity="0.7" />

  <!-- Bar 2 (Center - High) -->
  <line x1="256" y1="120" x2="256" y2="380" stroke="#10B981" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
  <rect x="234" y="170" width="44" height="150" rx="10" fill="url(#primaryGrad)" filter="url(#glow)" />

  <!-- Bar 3 (Right) -->
  <line x1="352" y1="160" x2="352" y2="320" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" opacity="0.4" />
  <rect x="336" y="200" width="32" height="80" rx="8" fill="url(#accentGrad)" opacity="0.8" />

  <!-- Upward Trend vector curve -->
  <path d="M 120 340 Q 220 310 256 220 T 390 140" fill="none" stroke="#34D399" stroke-width="10" stroke-linecap="round" filter="url(#glow)" />

  <!-- Trend Arrow -->
  <polygon points="390,140 365,145 385,165" fill="#34D399" filter="url(#glow)" />

  <!-- Institutional Dot Accent -->
  <circle cx="390" cy="140" r="7" fill="#F0FDF4" />
</svg>
